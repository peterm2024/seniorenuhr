name: Host-Tests

# Der ICS-Parser (components/kalender) ist portabel geschrieben und laeuft
# unveraendert auch auf dem PC (siehe test_host/teste.ps1 fuer die lokale
# Windows-Variante). Dieser Workflow baut denselben Test mit gcc unter Linux
# und laeuft bei jedem Push/PR, ohne den ESP-IDF-Container zu brauchen.
on:
  push:
    paths:
      - "components/kalender/**"
      - "main/tabletten_protokoll.*"
      - "main/protokoll_ansicht.*"
      - "main/version_vergleich.*"
      - "test_host/**"
  pull_request:
    paths:
      - "components/kalender/**"
      - "main/tabletten_protokoll.*"
      - "main/protokoll_ansicht.*"
      - "main/version_vergleich.*"
      - "test_host/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: ICS-Parser-Tests bauen
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            -Icomponents/kalender/include \
            components/kalender/ics_parser.c \
            test_host/test_ics_parser.c \
            -o test_host/test_ics

      - name: ICS-Parser-Tests ausfuehren
        run: ./test_host/test_ics

      # Liegt in main/ und braucht deshalb die ESP-Header-Stubs; die Dateipfade
      # werden auf temporaere Namen umgebogen (der Test legt Dateien an).
      - name: Protokoll-Tests bauen
        run: |
          gcc -std=c99 -Wall -Wextra -Werror \
            -Icomponents/kalender/include -Imain -Itest_host/stubs \
            -include test_host/stubs/testpfade.h \
            main/tabletten_protokoll.c \
            main/protokoll_ansicht.c \
            test_host/test_protokoll.c \
            -o test_host/test_protokoll

      - name: Protokoll-Tests ausfuehren
        run: cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/test_host/test_protokoll"

      - name: Versionsvergleich-Tests bauen und ausfuehren
        run: |
          gcc -std=c99 -Wall -Wextra -Werror -Imain \
            main/version_vergleich.c test_host/test_version.c \
            -o test_host/test_version
          ./test_host/test_version
