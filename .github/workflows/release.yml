name: Release-Build

# Ausgeloest durch "git tag vX.Y.Z && git push --tags" - der Tag wird 1:1
# zur Firmware-Version (siehe main/ota.c: esp_app_get_description()->version
# kommt per "git describe" automatisch aus dem Tag, sofern die Historie beim
# Checkout vollstaendig ist, siehe fetch-depth unten).
on:
  push:
    tags:
      - "v*"

# Das Release entsteht in einem ANDEREN Repo (siehe unten), dafuer wird ein
# eigenes Token verwendet - der automatische GITHUB_TOKEN braucht hier also
# nur Lesezugriff zum Auschecken.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Offizieller ESP-IDF-Container - dieselbe Toolchain-Version wie lokal
    # (main/CLAUDE.md/README: ESP-IDF 5.5).
    container:
      image: espressif/idf:v5.5

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          # Volle Historie inkl. Tags - "git describe" (siehe oben) braucht
          # den Tag, ein flacher Checkout liefert sonst nur einen Hash.
          fetch-depth: 0

      # secrets.h liegt NICHT im Repo (siehe .gitignore) - der Platzhalter
      # aus secrets.example.h landet in der Release-Binary. Damit ist ein
      # versehentliches Veroeffentlichen von Peters WLAN-Passwort oder der
      # privaten Kalender-URL seiner Eltern strukturell ausgeschlossen,
      # nicht nur durch Sorgfalt vermieden (siehe FAHRPLAN.md Phase 5).
      - name: Platzhalter-Zugangsdaten einsetzen
        run: cp main/secrets.example.h main/secrets.h

      - name: Firmware bauen (Produktions-Build, ohne Entwicklungswerkzeuge)
        shell: bash
        run: |
          # Ohne dies scheitert "git describe" im Container mit "detected
          # dubious ownership" - actions/checkout traegt safe.directory nur
          # in die Git-Config des RUNNER-Benutzers ein, der Build laeuft aber
          # im ESP-IDF-Container als anderer Benutzer. ESP-IDF faellt dann
          # still auf die Version "1" zurueck. Das ist toedlich fuer OTA:
          # jedes Release hiesse "1", das Geraet saehe nach dem ersten
          # Update nie wieder eine neue Version.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sed -i 's/#define ENTWICKLUNGSWERKZEUGE 1/#define ENTWICKLUNGSWERKZEUGE 0/' main/app_main.c
          . "$IDF_PATH/export.sh"
          idf.py build

      # Sicherung gegen genau den obigen Fehler: die Version steckt im
      # esp_app_desc_t der fertigen Binary und MUSS dem Tag entsprechen.
      # Lieber ein fehlgeschlagener Release-Build als ein Geraet, das
      # kuenftige Updates nicht mehr als solche erkennt.
      - name: Version in der Binary gegen den Tag pruefen
        shell: bash
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import struct, sys
          erwartet = sys.argv[1]
          d = open('build/seniorenuhr.bin','rb').read()
          i = d.find(struct.pack('<I', 0xABCD5432))
          if i < 0:
              sys.exit('esp_app_desc_t nicht gefunden - Binary unbrauchbar')
          ist = d[i+16:i+48].split(b'\x00')[0].decode()
          print(f'Version in der Binary: {ist!r}, erwartet: {erwartet!r}')
          if ist != erwartet:
              sys.exit(f'FEHLER: Version "{ist}" passt nicht zum Tag "{erwartet}" - '
                       'vermutlich ist "git describe" fehlgeschlagen (siehe safe.directory oben). '
                       'Ein Release mit falscher Version wuerde die OTA-Erkennung dauerhaft lahmlegen.')
          PY

      - name: Version fuer die Release-Notiz ermitteln
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Veroeffentlicht wird in einem SEPARATEN, oeffentlichen Repo
      # (peterm2024/seniorenuhr-firmware). Grund: dieses Quellcode-Repo ist
      # privat, und ein privates Release-Asset laesst sich vom Geraet nicht
      # ohne eingebettetes Zugangstoken herunterladen - ein Token in der
      # Firmware waere aber genau das, was man nicht will (landet im Binary,
      # laeuft ab). Das oeffentliche Repo enthaelt ausschliesslich fertige
      # Binaries mit Platzhalter-Zugangsdaten (siehe secrets.example.h oben),
      # also nichts Schuetzenswertes.
      #
      # FIRMWARE_REPO_TOKEN ist ein fein granulares PAT mit "Contents:
      # read and write" NUR auf jenem Repo, hinterlegt als Actions-Secret.
      # Der automatische GITHUB_TOKEN taugt hier nicht - er gilt immer nur
      # fuer das Repo, in dem der Workflow laeuft.
      - name: Firmware ins oeffentliche Download-Repo veroeffentlichen
        uses: softprops/action-gh-release@v2
        with:
          repository: peterm2024/seniorenuhr-firmware
          token: ${{ secrets.FIRMWARE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: Seniorenuhr ${{ steps.version.outputs.version }}
          files: build/seniorenuhr.bin
          body: |
            Firmware-Datei fuer die Seniorenuhr (ESP32-S3).

            Das Geraet laedt diese Datei selbst herunter, sobald das Update
            im Einstellungen-Menue bestaetigt wird. Der Quellcode liegt in
            einem separaten, privaten Repo.
